version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://rmj:rmj_secure_password@db:5432/absensi_rmj

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=rmj
      - POSTGRES_PASSWORD=rmj_secure_password
      - POSTGRES_DB=absensi_rmj
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
